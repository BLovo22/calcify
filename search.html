<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta property="og:title" content="Search | Numbrly">
<meta property="og:description" content="Search Numbrly — free financial calculators and money guides.">
<meta property="og:url" content="https://numbrly.cc/search.html">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Search | Numbrly">
<meta name="twitter:description" content="Search Numbrly — free financial calculators and money guides.">
<link rel="canonical" href="https://numbrly.cc/search.html">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search | Numbrly</title>
<link rel="stylesheet" href="style.css">
<style>
.search-hero{text-align:center;padding:60px 0 40px}
.search-hero h1{font-size:24px;margin-bottom:8px}
.search-hero input{width:100%;max-width:500px;padding:14px 20px;border:2px solid var(--border);border-radius:12px;font-size:16px;font-family:inherit;background:var(--bg);color:var(--text);transition:border-color .2s}
.search-hero input:focus{outline:none;border-color:var(--pri)}
.results{margin-top:20px}
.results a{display:block;padding:14px 18px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;text-decoration:none;color:var(--text);transition:border-color .15s,background .15s}
.results a:hover{border-color:var(--pri);background:var(--pri-light)}
.results .r-title{font-weight:600;font-size:15px}
.results .r-url{font-size:12px;color:var(--muted);margin-top:2px}
.no-results{text-align:center;color:var(--muted);padding:40px;font-size:14px}
</style>
</head>
<body>
<nav class="nav"><div class="nav-in"><a href="index.html" class="logo">Num<span>brly</span></a><a href="index.html">Tools</a><a href="index.html#guides">Guides</a><a href="privacy-policy.html">Privacy</a><a href="search.html" style="color:var(--muted);text-decoration:none;font-size:16px;line-height:1">&#x1F50D;</a><button class="theme-btn" onclick="toggleTheme()" title="Toggle dark mode" id="themeIcon" style="margin-left:auto">&#x1F319;</button></div></nav>
<script>(function(){var s=localStorage.getItem('theme');if(s)document.documentElement.setAttribute('data-theme',s);else if(window.matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.setAttribute('data-theme','dark');window.toggleTheme=function(){var c=document.documentElement.getAttribute('data-theme');var n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('theme',n);document.getElementById('themeIcon').innerHTML=n==='dark'?'☀️':'🌙';};var icon=document.getElementById('themeIcon');if(icon)icon.innerHTML=(s||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':''))==='dark'?'☀️':'🌙';})();</script>

<main class="main">
<div class="search-hero">
<h1>&#x1F50D; Search Numbrly</h1>
<p style="color:var(--muted);font-size:14px">Find calculators and guides</p>
<input type="text" id="bigSearch" placeholder="mortgage, compound interest, retirement..." autofocus oninput="doSearch()">
<div class="results" id="results"></div>
</div>
</main>

<footer><div class="footer-links"><a href="index.html">Tools</a><a href="index.html#guides">Guides</a><a href="privacy-policy.html">Privacy Policy</a></div><p>&copy; 2026 Numbrly.</p></footer>

<script src="search-data.js"></script>

</body>
</html>
