<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found | Numbrly</title>
<meta name="description" content="The Numbrly page you requested could not be found.">
<meta property="og:title" content="Page Not Found | Numbrly">
<meta property="og:url" content="https://numbrly.cc/404.html">
<link rel="canonical" href="https://numbrly.cc/404.html">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="style.css">
<script>
(function(){
  var theme = localStorage.getItem("theme") || "dark";
  document.documentElement.setAttribute("data-theme", theme);
  document.documentElement.classList.toggle("dark", theme === "dark");
})();
</script>
</head>
<body class="error-page">
<a href="/" class="error-brand" aria-label="Numbrly home">
  <span aria-hidden="true">N</span>
  <strong>Numbrly</strong>
</a>
<main class="main">
  <div class="err">
    <p class="error-kicker">Lost in the money lab / error 404</p>
    <div class="code" aria-hidden="true">404</div>
    <h1>This number does not lead anywhere.</h1>
    <p>The page may have moved, changed its name, or never existed. The calculators and research desk are still here.</p>
    <div class="links">
      <a href="/" class="btn">Return home</a>
      <a href="/search.html" class="error-link--outline">Search Numbrly</a>
    </div>
  </div>
</main>
<script defer src="assets/site-ui.js"></script>
</body>
</html>
