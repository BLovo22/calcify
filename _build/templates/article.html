<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{OG_DESC}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:type" content="article">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{OG_TITLE}}">
<meta name="twitter:description" content="{{OG_DESC}}">
<link rel="canonical" href="{{CANONICAL}}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ARTICLE_HEADLINE}}",
  "url": "{{CANONICAL}}",
  "datePublished": "{{DATE_PUB}}",
  "dateModified": "{{DATE_MOD}}",
  "author": {"@type": "Organization", "name": "Numbrly"}
}
</script>
<script type="application/ld+json">{{SCHEMA_BREADCRUMB}}</script>
<script type="application/ld+json">{{SCHEMA_FAQ}}</script>
<link rel="icon" type="image/svg+xml" href="{{FAVICON_PATH}}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SEO_TITLE}}</title>
<meta name="description" content="{{META_DESC}}">
<meta name="keywords" content="{{META_KEYWORDS}}">
<link rel="stylesheet" href="{{CSS_PATH}}">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:"class"}</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4970468814214538" crossorigin="anonymous" defer></script>
<script>(function(){var s=localStorage.getItem("theme");if(s){document.documentElement.setAttribute("data-theme",s);if(s==="dark")document.documentElement.classList.add("dark")}else if(window.matchMedia("(prefers-color-scheme:dark)").matches){document.documentElement.setAttribute("data-theme","dark");document.documentElement.classList.add("dark")}window.toggleTheme=function(){var c=document.documentElement.getAttribute("data-theme");var n=c==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",n);if(n==="dark")document.documentElement.classList.add("dark");else document.documentElement.classList.remove("dark");localStorage.setItem("theme",n);document.getElementById("themeBtn").innerHTML=n==="dark"?"\u2600\uFE0F":"\uD83C\uDF19"};})();</script>
</head>
<body>
{{HEADER}}

<main class="main">
  <div class="breadcrumb">
    <a href="{{HOME_PATH}}">Numbrly</a> / <a href="{{HOME_PATH}}#guides">Guides</a> / {{H1}}
  </div>

  <article class="article-body">
{{ARTICLE_CONTENT}}
  </article>
</main>

<script>
(function(){
  var hs = document.querySelectorAll(".article-body h2");
  var list = document.getElementById("tocList");
  if (!list || hs.length === 0) return;
  list.innerHTML = "";
  hs.forEach(function(h, i) {
    h.id = "section-" + i;
    var li = document.createElement("li");
    var a = document.createElement("a");
    a.href = "#section-" + i;
    a.textContent = h.textContent;
    li.appendChild(a);
    list.appendChild(li);
  });
})();
</script>

{{FOOTER}}
</body>
</html>
