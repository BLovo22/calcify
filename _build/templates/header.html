<!-- SHARED HEADER -->
<header class="site-header">
  <div class="site-header__shell">
    <a href="/" class="site-brand" aria-label="Numbrly home">
      <span class="site-brand__mark" aria-hidden="true">N</span>
      <span class="site-brand__word">Numbrly</span>
      <span class="site-brand__tag">personal<br>finance lab</span>
    </a>

    <nav class="site-nav" aria-label="Primary navigation">
      <a href="/#calculators" data-nav="tools">Tools</a>
      <a href="/guides/" data-nav="guides">Guides</a>
      <a href="/#about" data-nav="about">About</a>
    </nav>

    <form class="site-search" role="search" onsubmit="event.preventDefault(); window.location.href='/search.html?q='+encodeURIComponent(this.q.value)">
      <svg class="site-search__icon" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/>
      </svg>
      <input type="search" name="q" aria-label="Search calculators and guides" placeholder="Search the money lab">
      <span class="site-search__key" aria-hidden="true">/</span>
    </form>

    <button type="button" onclick="toggleTheme()" id="themeBtn" class="theme-toggle" title="Toggle color theme" aria-label="Toggle color theme" aria-pressed="false">
      <span data-theme-icon aria-hidden="true">◐</span>
    </button>
    <button type="button" id="menuBtn" class="menu-toggle" aria-label="Open menu" aria-controls="mobileNav" aria-expanded="false">
      <span aria-hidden="true"></span>
    </button>
  </div>

  <nav id="mobileNav" class="mobile-nav hidden" aria-label="Mobile navigation">
    <a href="/#calculators" data-nav="tools">Tools</a>
    <a href="/guides/" data-nav="guides">Guides</a>
    <a href="/#about" data-nav="about">About</a>
    <a href="/privacy-policy.html">Privacy</a>
  </nav>
</header>
